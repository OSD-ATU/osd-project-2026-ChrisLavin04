<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Team' : 'Add New Team' }}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <div class="error" *ngIf="error">{{ error }}</div>
      
      <form [formGroup]="teamForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Team Name</mat-label>
          <input matInput formControlName="name">
          <mat-error *ngIf="teamForm.get('name')?.hasError('required')">
            Team name is required
          </mat-error>
          <mat-error *ngIf="teamForm.get('name')?.hasError('minlength')">
            Name must be at least 2 characters
          </mat-error>
          <mat-error *ngIf="teamForm.get('name')?.hasError('maxlength')">
            Name cannot exceed 100 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Coach ID</mat-label>
          <input matInput formControlName="coach">
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="!teamForm.valid">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
          <button mat-raised-button type="button" (click)="onCancel()">
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
