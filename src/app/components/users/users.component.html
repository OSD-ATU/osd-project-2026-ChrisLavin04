<div class="users-container">
  <div class="header">
    <h2>Users</h2>
    <button class="btn-add" routerLink="/users/new">+ Add User</button>
  </div>
  
  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="loading" *ngIf="loading">Loading users...</div>
  
  <div class="users-list" *ngIf="!loading">
    <!-- Desktop Table View -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user._id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td><span class="role-badge" [class]="user.role">{{ user.role }}</span></td>
          <td>
            <button class="btn-edit" [routerLink]="['/users/edit', user._id]">Edit</button>
            <button class="btn-delete" (click)="deleteUser(user._id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Mobile Card View -->
    <div class="user-card" *ngFor="let user of users">
      <h3>{{ user.username }}</h3>
      <p><strong>ID:</strong> {{ user._id }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Role:</strong> <span class="role-badge" [class]="user.role">{{ user.role }}</span></p>
      <div class="actions">
        <button class="btn-edit" [routerLink]="['/users/edit', user._id]">Edit</button>
        <button class="btn-delete" (click)="deleteUser(user._id)">Delete</button>
      </div>
    </div>
  </div>

  <div class="no-users" *ngIf="users.length === 0 && !loading">
    <p>No users found.</p>
  </div>
</div>
