<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Match' : 'Add New Match' }}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <div class="error" *ngIf="error">{{ error }}</div>
      
      <form [formGroup]="matchForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Home Team</mat-label>
          <mat-select formControlName="home_team_id">
            <mat-option *ngFor="let team of teams" [value]="team._id">
              {{ team.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="matchForm.get('home_team_id')?.hasError('required')">
            Home team is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Away Team</mat-label>
          <mat-select formControlName="away_team_id">
            <mat-option *ngFor="let team of teams" [value]="team._id">
              {{ team.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="matchForm.get('away_team_id')?.hasError('required')">
            Away team is required
          </mat-error>
        </mat-form-field>

        <div class="score-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Home Score</mat-label>
            <input matInput type="number" formControlName="home_score">
            <mat-error *ngIf="matchForm.get('home_score')?.hasError('required')">
              Score is required
            </mat-error>
            <mat-error *ngIf="matchForm.get('home_score')?.hasError('min')">
              Score cannot be negative
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Away Score</mat-label>
            <input matInput type="number" formControlName="away_score">
            <mat-error *ngIf="matchForm.get('away_score')?.hasError('required')">
              Score is required
            </mat-error>
            <mat-error *ngIf="matchForm.get('away_score')?.hasError('min')">
              Score cannot be negative
            </mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Match Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="date">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error *ngIf="matchForm.get('date')?.hasError('required')">
            Date is required
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="!matchForm.valid">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
          <button mat-raised-button type="button" (click)="onCancel()">
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
