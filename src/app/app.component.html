<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/">{{ title }}</a>
    </div>
    <div class="nav-actions">
      <button class="dark-toggle" (click)="toggleDarkMode()">
        {{ darkModeService.darkMode() ? 'Light Mode' : 'Dark Mode' }}
      </button>
      <!-- Hamburger menu button for mobile -->
      <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu">
        <span [class.open]="navbarService.menuOpen()">&#9776;</span>
      </button>
    </div>
    <ul class="nav-menu" [class.open]="navbarService.menuOpen()">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a></li>
      
      <!-- Show these links only when logged in -->
      <ng-container *ngIf="authService.isLoggedIn()">
        <!-- Admin: can create teams, matches, and view players -->
        <li *ngIf="authService.getRole() === 'admin'">
          <a routerLink="/teams" routerLinkActive="active" (click)="closeMenu()">Teams</a>
        </li>
        <li *ngIf="authService.getRole() === 'admin'">
          <a routerLink="/players" routerLinkActive="active" (click)="closeMenu()">Players</a>
        </li>
        <li *ngIf="authService.getRole() === 'admin'">
          <a routerLink="/matches" routerLinkActive="active" (click)="closeMenu()">Matches</a>
        </li>
        <!-- Coach: can create players and add to teams -->
        <li *ngIf="authService.getRole() === 'coach'">
          <a routerLink="/players" routerLinkActive="active" (click)="closeMenu()">Players</a>
        </li>
        <li *ngIf="authService.getRole() === 'coach'">
          <a routerLink="/teams" routerLinkActive="active" (click)="closeMenu()">Teams</a>
        </li>
        <li *ngIf="authService.getRole() === 'coach'">
          <a routerLink="/matches" routerLinkActive="active" (click)="closeMenu()">Matches</a>
        </li>
        <!-- Player: can only view -->
        <li *ngIf="authService.getRole() === 'player'">
          <a routerLink="/teams" routerLinkActive="active" (click)="closeMenu()">Teams</a>
        </li>
        <li *ngIf="authService.getRole() === 'player'">
          <a routerLink="/players" routerLinkActive="active" (click)="closeMenu()">Players</a>
        </li>
        <li *ngIf="authService.getRole() === 'player'">
          <a routerLink="/matches" routerLinkActive="active" (click)="closeMenu()">Matches</a>
        </li>
        <!-- Admin: can view users -->
        <li *ngIf="authService.getRole() === 'admin'">
          <a routerLink="/users" routerLinkActive="active" (click)="closeMenu()">Users</a>
        </li>
      </ng-container>
      
      <!-- Show login when not logged in -->
      <li *ngIf="!authService.isLoggedIn()">
        <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Login</a>
      </li>
      
      <!-- Show user info and logout when logged in -->
      <li *ngIf="authService.isLoggedIn()" class="user-info">
        <a class="user-name" routerLink="/profile" (click)="closeMenu()">{{ (authService.currentUser$ | async)?.username }}</a>
        <button class="logout-btn" (click)="logout(); closeMenu()">Logout</button>
      </li>
    </ul>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <p>&copy; 2025 Sports Management System. Built with Angular.</p>
</footer>
